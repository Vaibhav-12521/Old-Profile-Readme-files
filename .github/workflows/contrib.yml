name: Update contribution graphs

on:
  schedule:
    - cron: "30 0 * * *" # every day, 06:00 IST
  workflow_dispatch:
  push:
    paths:
      - papercut-assets/contrib.mjs
      - .github/workflows/contrib.yml

permissions:
  contents: write

concurrency:
  group: contrib-graphs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build graphs
        run: node papercut-assets/contrib.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- papercut-assets; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papercut-assets/contrib-*.svg
          git commit -m "Update contribution graphs"
          git push
