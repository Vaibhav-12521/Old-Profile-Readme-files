<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="GITHUB STATS">
  
  <defs>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3b2a1a" flood-opacity=".32"/>
    </filter>
    <filter id="shs" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#3b2a1a" flood-opacity=".3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .22  0 0 0 0 .15  0 0 0 .09 0"/>
    </filter>
  </defs>
  <g><animateTransform attributeName="transform" type="rotate" values="-1.4 600 55;1.4 600 55;-1.4 600 55" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  <g filter="url(#sh)">
    <path d="M 369 34 L 439 34 L 439 86 L 369 86 L 393 60 Z" fill="#264653"/>
    <path d="M 831 34 L 761 34 L 761 86 L 831 86 L 807 60 Z" fill="#264653"/>
  </g>
  <g filter="url(#sh)"><rect x="429" y="22" width="342" height="56" rx="4" fill="#e76f51" transform="rotate(-1 600 50)"/></g>
  <text x="600" y="60" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="31" font-weight="800" fill="#fffaf2" letter-spacing="2" transform="rotate(-1 600 50)">GITHUB STATS</text>
  </g>
</svg>
