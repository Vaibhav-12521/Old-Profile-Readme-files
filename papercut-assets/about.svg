    <text x="80" y="170"><tspan>🏆<animate attributeName="dy" values="0;-3;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></tspan><tspan dx="14">Technex '25 runner-up · Techfest '25 winner ·</tspan><tspan font-weight="800" fill="#e76f51"> Google GenAI Exchange</tspan><tspan></tspan></text>
